<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#bot{position:absolute;left:10vw;top:10vh;width:80vw;height:80vh}</style></head><body><div id="bot"></div><script src="mood-mates/core/geometry.js"></script><script src="mood-mates/core/render.js"></script><script src="mood-mates/core/features.js"></script><script src="mood-mates/core/fx.js"></script><script src="mood-mates/data/emotions.js"></script><script src="mood-mates/core/engine.js"></script><script src="mood-mates/characters/nimbo.js"></script><script src="mood-mates/characters/twinkle.js"></script><script src="rings.js"></script><script src="emotions.js"></script><script src="ball.js"></script><script src="engine.js"></script><script>var bot=EmotionBall.create(document.getElementById('bot'),{emotion:'02',idle:false,eyeScale:1.25});
var cycle=null,current='02',enabled=true,index=0,shape='blob';
window.setMikaShape=function(value){if(shape===value)return;shape=value;bot.destroy();document.getElementById('bot').innerHTML='';bot=shape==='blob' ? EmotionBall.create(document.getElementById('bot'),{emotion:current,idle:false,eyeScale:1.25}) : MoodMates.create(document.getElementById('bot'),{character:shape==='wedge'?'nimbo':'twinkle',emotion:current,idle:false});};
var profiles={'00':['00'],'02':['02','03','04','02','14'],'32':['31','30','32','16','32'],'35':['35','03','35','11'],'13':['13','35','03'],'20':['20','35','11'],'33':['33','10','19','10','19'],'34':['34','12','20','34'],'41':['41','18','02']};
function stopCycle(){if(cycle!==null){clearTimeout(cycle);cycle=null;}}
function schedule(){stopCycle();if(!enabled||document.hidden)return;cycle=setTimeout(function(){var list=profiles[current]||[current];index=(index+1)%list.length;bot.setEmotion(list[index]);schedule();},6500);}
window.setMikaState=function(id,active){stopCycle();current=id;enabled=active;index=0;bot.setActive(active&&!document.hidden);bot.setEmotion(id);if(!active||document.hidden)bot.renderStatic();else schedule();};
document.addEventListener('visibilitychange',function(){stopCycle();bot.setActive(enabled&&!document.hidden);if(enabled&&!document.hidden)schedule();});
window.destroyMika=function(){stopCycle();bot.destroy();};
</script></body></html>
