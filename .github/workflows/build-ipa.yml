name: Build phongent iOS 16 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # 不签名：TrollStore 会在安装时用 CoreTrust 重新签名
      - name: Build for iOS device (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project MikaRemote.xcodeproj \
            -target MikaRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Stage Payload
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/MikaRemote.app Payload/
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/MikaRemote.app/Info.plist
          find Payload -maxdepth 3 -name '*.appex' -print

      # 打一个 adhoc 签名把 App Group entitlement 写进二进制，
      # 让 TrollStore 安装后 Widget 仍能读取共享数据；失败不阻塞交付。
      - name: Preserve entitlements for TrollStore
        run: |
          set -u
          APPEX=$(find Payload/MikaRemote.app/PlugIns -maxdepth 1 -name '*.appex' 2>/dev/null | head -1 || true)
          if [ -n "$APPEX" ]; then
            codesign --force --sign - --timestamp=none \
              --entitlements ios/Widgets/Mika.entitlements "$APPEX" || echo "appex adhoc sign skipped"
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements ios/App/Mika.entitlements Payload/MikaRemote.app || echo "app adhoc sign skipped"

      - name: Pack IPA
        run: |
          set -euo pipefail
          zip -qry phongent-ios16.ipa Payload
          ls -lh phongent-ios16.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: phongent-ios16-unsigned
          path: phongent-ios16.ipa
          if-no-files-found: error
          retention-days: 14
